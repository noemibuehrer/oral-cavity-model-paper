    outs:
      - models/histories/midline+II_I+III_V.csv
      - models/samples/midline+II_I+III_V.hdf5
  
  extract-model_params:
    cmd: >
      python ocmscripts/model_parameters.py
    deps:
      - uv.lock
      - models/configs/graphs/midline+II_I+III_V.ly.yaml
      - models/samples/midline+II_I+III_V.hdf5
      - ocmscripts/model_parameters.py
    outs:
