      - models/configs/sampling.ly.yaml:
    outs:
      - models/histories/midline_base.csv
      - models/samples/midline_base.hdf5

  sample-midline-winning:
    cmd: >
      lyscripts sample  
      --configs models/configs/graphs/midline+II_I+III_V.ly.yaml
