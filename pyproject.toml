[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ocmscripts"
version = "0.0.1"
description = "Modelling the tumour progression based on lymphatic spread patterns of newly diagnosed oral cavity squamous cell carcinoma patient records."
authors = [
    { name = "Roman Ludwig"},
    { name = "Noemi Bührer"},
]
readme = "README.md"
requires-python = "~=3.10"
dependencies = [
    "loguru",
    "python-dotenv",
    "tqdm",
    "typer",
    "dvc",
    "lydata",
    "lymph-model>=1.3.8",
    "lyscripts>=1.0.2",
]

[tool.ruff]
line-length = 99
src = ["ocmscripts"]
include = ["pyproject.toml", "ocmscripts/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["ocmscripts"]
force-sort-within-sections = true

[project.optional-dependencies]
dev = [
    "ipykernel>=6.30.1",
    "ruff>=0.13.0",
]
